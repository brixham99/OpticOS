<template id="p2">
<div class="in" style="--c:#fe5308">
  <div class="hue"></div>
  <h1><small>Part 1</small>Setting up</h1>
  <h2>1. Get OpticOS</h2>
  <div class="rel">{{QR_REL}}<div>
  <p>Download the latest release from GitHub:<br><b>github.com/brixham99/OpticOS/releases/latest</b></p>
  <p class="note">Release v1.0.3 (14 November 2026) has these files:</p></div></div>
  <table class="files">
  <tr><td>opticos.rom</td><td>the OpticOS ROM (16 KB): the one you need</td></tr>
  <tr><td>OpticOS_User_Manual.pdf</td><td>the full user manual</td></tr>
  <tr><td>opticos_examples.tzx / .tap</td><td>the example tape (either works in Fuse)</td></tr>
  <tr><td>spec.pdf</td><td>the technical specification</td></tr></table>
  <p class="note">The games are in their own repositories (links on the back page): <span class="mono">happybat.tzx</span> from Happy Bat's releases, and <span class="mono">dino.tzx</span> from the ZX-Dino repository.</p>
  <h2>2. Install Fuse for macOS</h2>
  <p>Fuse for macOS 1.10.1 needs a Mac with Apple silicon and macOS 14.4 or later.</p>
  <ol class="steps">
  <li>Go to <b>fuse-for-macosx.sourceforge.io</b> and download <span class="mono">FuseForMacOS-1.10.1.zip</span>, or in Terminal type <code>brew install --cask fredm-fuse</code> <span class="note">(not <code>fuse</code>: that is a different app)</span>.</li>
  <li>Double-click the zip, then drag <b>Fuse</b> from the <i>Fuse for macOS</i> folder into <b>Applications</b>.</li>
  <li>Open Fuse. It is signed and notarised by its developer, so macOS just asks you once to confirm opening an app from the internet: click <b>Open</b>.</li>
  </ol>
  <h2>3. Make OpticOS the Spectrum's ROM</h2>
  <ol class="steps">
  <li>Keep <span class="mono">opticos.rom</span> somewhere it will stay, such as a folder in Documents (not inside the Fuse app).</li>
  <li>Choose <b>Fuse &gt; Preferences…</b> (<kbd>⌘</kbd><kbd>,</kbd>; newer macOS may call it Settings…) and open the <b>ROM</b> pane. Set the ROM for <b>Spectrum 48K</b> to <span class="mono">opticos.rom</span>.</li>
  <li>In the <b>Machine</b> pane choose <b>Spectrum 48K</b>.</li>
  <li>Choose <b>Machine &gt; Hard Reset</b>. OpticOS starts, with a two-note chime.</li>
  </ol>
  <p class="note">Preferences &gt; General &gt; <i>Reset Preferences</i> puts Fuse back as it was. On Linux, start the Unix Fuse with <code>fuse --machine 48 --rom-48 opticos.rom</code>.</p>
  <div class="folio"><span>2</span><span>OpticOS QuickStart: Fuse on the Mac</span></div>
</div>
</template>

<template id="p3">
<div class="in" style="--c:#0391ce">
  <div class="hue"></div>
  <h1><small>Part 2</small>Typing on a Mac</h1>
  <p>Letters, numbers, <kbd>SPACE</kbd> and <kbd>return</kbd> (<kbd>ENTER</kbd>) work as normal. Type keywords letter by letter, in capitals or not. Wait for the chime to finish before you type.</p>
  <table class="keys">
  <tr><td><b>Spectrum key</b></td><td><b>On the Mac</b></td></tr>
  <tr><td><kbd>CAPS SHIFT</kbd></td><td><kbd>shift</kbd></td></tr>
  <tr><td><kbd>SYMBOL SHIFT</kbd></td><td><kbd>option</kbd> (or <kbd>⌘</kbd>, but ⌘ with O, B, J and others are Fuse menu shortcuts)</td></tr>
  <tr><td><kbd>DELETE</kbd></td><td><kbd>delete</kbd></td></tr>
  <tr><td><kbd>BREAK</kbd></td><td><kbd>shift</kbd>+<kbd>SPACE</kbd> (stops a program)</td></tr>
  <tr><td><code>"</code> <code>:</code> <code>;</code> <code>+</code> <code>=</code></td><td>usually just type them; or <kbd>option</kbd> with <kbd>P</kbd> <kbd>Z</kbd> <kbd>O</kbd> <kbd>K</kbd> <kbd>L</kbd></td></tr>
  <tr><td><code>*</code></td><td><kbd>option</kbd>+<kbd>B</kbd></td></tr></table>
  <h2>Try these at the prompt</h2>
<pre>] PRINT "Hello from OpticOS!"
] PRINT 2 + 2
] BORDER 1: PAPER 6: INK 1: CLS
] PRINT "Blue on yellow"
] BEEP 0.5, 7    <span class="c">a G for half a second</span></pre>
  <div class="colours"><span style="background:#000;color:#fff">0 black</span><span style="background:#0000d8;color:#fff">1 blue</span><span style="background:#d80000;color:#fff">2 red</span><span style="background:#d800d8;color:#fff">3 magenta</span><span style="background:#00d800">4 green</span><span style="background:#00d8d8">5 cyan</span><span style="background:#d8d800">6 yellow</span><span style="background:#fff">7 white</span></div>
  <h2>Your first program</h2>
  <p>OpticBASIC has no line numbers. Type <code>AUTO</code> and the prompt becomes <code>+</code>: each line you type is added to the program. Press <kbd>return</kbd> on an empty line to finish.</p>
<pre style="--c:#0391ce">] AUTO
+ FOR i = 1 TO 5
+ PRINT INK i; "OpticOS "; i
+ BEEP 0.1, i * 2       <span class="c">* is option+B</span>
+ NEXT
+                <span class="c">just return</span>
] RUN            <span class="c">run it</span>
] LIST           <span class="c">see it again, neatly indented</span></pre>
  <p>RUN prints five lines in five colours, with a rising beep for each. <code>NEW</code> wipes the program and restarts OpticOS, just like switching on.</p>
  <div class="folio"><span>OpticOS QuickStart: Fuse on the Mac</span><span>3</span></div>
</div>
</template>

<template id="p4">
<div class="in" style="--c:#8601af">
  <div class="hue"></div>
  <h1><small>Part 3</small>Loading tapes</h1>
  <ol class="steps">
  <li>Choose <b>File &gt; Open File…</b> (<kbd>⌘</kbd><kbd>O</kbd>) and pick a tape: <span class="mono">.tzx</span> or <span class="mono">.tap</span>.</li>
  <li>Type <code>LOAD ""</code> and press <kbd>return</kbd>. With Fuse's standard settings the tape loads in a moment. If it doesn't start, choose <b>Media &gt; Tape &gt; Play</b>.</li>
  </ol>
  <p class="note">With <i>Auto-load media</i> on (the default), opening a tape restarts the Spectrum. OpticOS ignores Fuse's automatic typing, so you get a fresh <span class="mono">]</span> prompt and the tape waits for your <code>LOAD ""</code>. To open a tape without losing your program, set <b>Preferences &gt; General &gt; Auto-load media</b> to <i>Disabled</i>.</p>
  <figure style="display:flex;gap:3mm;align-items:flex-end;margin-top:1.4mm"><img class="shot" style="width:52%" src="img/examples_menu.png" alt="The examples tape's menu in Fuse"><figcaption>The examples tape after <span class="mono">LOAD ""</span> in Fuse with its standard settings.</figcaption></figure>
  <p><b>The examples tape</b> shows this menu. Then load one by name: <code>LOAD "tree"</code>, <code>RUN</code> (about 25 seconds), <code>LIST</code>. <b>The games</b> start by themselves.</p>
  <h2 style="margin-top:2mm">Game controls</h2>
  <div class="games">
  <div class="game" style="--g:#66b032"><h2>Dino Run</h2><table>
    <tr><td><kbd>SPACE</kbd> <kbd>Q</kbd> <kbd>7</kbd></td><td>jump (hold to go higher)</td></tr>
    <tr><td><kbd>A</kbd> <kbd>6</kbd></td><td>duck</td></tr>
    <tr><td><kbd>SPACE</kbd></td><td>start, or play again</td></tr></table>
    <p class="note" style="margin:.8mm 0 0">Night falls at 700 points.</p></div>
  <div class="game" style="--g:#fb9902"><h2>Happy Bat</h2><table>
    <tr><td><kbd>SPACE</kbd></td><td>flap</td></tr>
    <tr><td><kbd>shift</kbd>+<kbd>SPACE</kbd></td><td>BREAK: stop</td></tr></table>
    <p class="note" style="margin:.8mm 0 0">Flap through the gaps in the pipes.</p></div>
  </div>
